name: git-graph trial (Tier 0)

# External-candidate trial: verify git-bahn/git-graph v0.8.3's real published
# archives on real runners. This is a Tier 0 local trial recorded in
# docs/ADOPTION.md — NOT adoption, and git-graph's maintainers have not been
# contacted. Platform expectations, stated honestly:
#   linux/amd64  -> shipsmoke gate runs the artifact for real (PASS expected)
#   windows/amd64-> shipsmoke gate runs the artifact for real (PASS expected)
#   macos/amd64  -> the gate runs on an arm64 macos-15 runner. Finding: the
#                   'macos-amd64'-named archive actually ships an arm64
#                   Mach-O binary (confirmed with file(1) and shipsmoke's
#                   header detection), so the first pass SKIPs honestly and a
#                   second pass declaring darwin/arm64 executes it natively.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    name: git-graph v0.8.3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: git-graph-v0.8.3-linux-amd64.tar.gz
            artifact: gitgraph-linux
          - os: macos-15
            asset: git-graph-v0.8.3-macos-amd64.tar.gz
            artifact: gitgraph-macos
          - os: windows-2025
            asset: git-graph-v0.8.3-windows-amd64.tar.gz
            artifact: gitgraph-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download the real published archive
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fsSL --retry 3 -o "dist/$ASSET" \
            "https://github.com/git-bahn/git-graph/releases/download/v0.8.3/$ASSET"
          ls -l "dist/$ASSET"

      - name: Write the trial config
        shell: bash
        env:
          GITGRAPH_CONFIG: ${{ github.workspace }}/.shipsmoke-gitgraph.yml
        run: |
          set -euo pipefail
          {
            echo 'version: 1'
            echo 'artifacts:'
            echo '  - name: gitgraph-linux'
            echo '    path: dist/git-graph-v0.8.3-linux-amd64.tar.gz'
            echo '    binary: git-graph'
            echo '    runs_on: [linux/amd64]'
            echo '    checks:'
            echo '      - args: ["--version"]'
            echo '        expect: { exit_code: 0, stdout_contains: ["git-graph"] }'
            echo '  - name: gitgraph-macos'
            echo '    path: dist/git-graph-v0.8.3-macos-amd64.tar.gz'
            echo '    binary: git-graph'
            echo '    runs_on: [darwin/amd64]'
            echo '    checks:'
            echo '      - args: ["--version"]'
            echo '        expect: { exit_code: 0, stdout_contains: ["git-graph"] }'
            echo '  - name: gitgraph-windows'
            echo '    path: dist/git-graph-v0.8.3-windows-amd64.tar.gz'
            echo '    binary: git-graph.exe'
            echo '    runs_on: [windows/amd64]'
            echo '    checks:'
            echo '      - args: ["--version"]'
            echo '        expect: { exit_code: 0, stdout_contains: ["git-graph"] }'
          } > "$GITGRAPH_CONFIG"

      - name: "Run the shipsmoke gate (linux/windows expect PASS; macos gate SKIPs the darwin/amd64 declaration on an arm64 runner - recorded as-is)"
        id: gate
        continue-on-error: true
        uses: geyutu6755/shipsmoke@v1
        with:
          version: v1.0.4
          config: .shipsmoke-gitgraph.yml
          artifact: ${{ matrix.artifact }}
          report: dist/report.json

      - name: "macOS only - identify the binary truthfully and run it natively"
        if: runner.os == 'macOS'
        shell: bash
        env:
          GITGRAPH_NATIVE: ${{ github.workspace }}/.shipsmoke-gitgraph-native.yml
        run: |
          set -euo pipefail
          tar -xzf "dist/git-graph-v0.8.3-macos-amd64.tar.gz"
          file git-graph
          # The 'macos-amd64'-named archive ships an arm64 Mach-O (confirmed by
          # file above and by shipsmoke's header detection): Intel-Mac users of
          # this asset get a broken download. Rosetta cannot translate arm64,
          # so the honest execution path on this arm64 runner is native: a
          # second gate pass declaring the platform the binary actually is.
          {
            echo 'version: 1'
            echo 'artifacts:'
            echo '  - name: gitgraph-macos'
            echo '    path: dist/git-graph-v0.8.3-macos-amd64.tar.gz'
            echo '    binary: git-graph'
            echo '    runs_on: [darwin/arm64]'
            echo '    checks:'
            echo '      - args: ["--version"]'
            echo '        expect: { exit_code: 0, stdout_contains: ["git-graph"] }'
          } > "$GITGRAPH_NATIVE"

      - name: "macOS only - gate pass declaring darwin/arm64 (exposes the naming/content mismatch)"
        if: runner.os == 'macOS'
        uses: geyutu6755/shipsmoke@v1
        with:
          version: v1.0.4
          config: .shipsmoke-gitgraph-native.yml
          artifact: gitgraph-macos
          report: dist/report-native.json

      - name: Record the trial outcome for this platform
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_EXIT: ${{ steps.gate.outputs.exit-code }}
          OS_NAME: ${{ matrix.os }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          echo "trial summary for $OS_NAME ($ASSET):"
          echo "  shipsmoke gate outcome: $GATE_OUTCOME (exit ${GATE_EXIT:-n/a})"
          if [ "$GATE_OUTCOME" = "success" ]; then
            echo "  tier-0 result: real extraction + real execution, PASS"
          else
            echo "  tier-0 result: gate refused or skipped the artifact on this runner; see the gate log and the native-execution step (macOS) for the exact, honest diagnosis"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitgraph-trial-${{ matrix.os }}
          path: dist/report.json
          if-no-files-found: ignore
